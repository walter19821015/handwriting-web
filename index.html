<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手写字迹生成器</title>
  <style>
    /* 基础重置 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* 顶部边框导航条（预留将来加东西） */
    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .brand {
      font-size: 18px;
      font-weight: 600;
      color: #1f2937;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 顶部预留拓展区 */
    .header-actions {
      display: flex;
      gap: 12px;
    }

    /* 主体工作区：左右双栏 */
    main {
      flex: 1;
      display: flex;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      gap: 24px;
    }

    /* 左侧控制面板容器 */
    .control-panel {
      width: 420px;
      flex-shrink: 0;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    /* 右侧画布预览容器 */
    .preview-panel {
      flex: 1;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      min-height: 600px;
    }

    .preview-header {
      width: 100%;
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 16px;
      text-align: left;
    }

    .canvas-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e5e7eb;
      border-radius: 8px;
      border: 1px dashed #cbd5e1;
      min-height: 500px;
    }

    /* 底部边框（预留将来加东西） */
    footer {
      background: #ffffff;
      border-top: 1px solid #e5e7eb;
      padding: 14px 24px;
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <!-- 顶部导航条 -->
  <header>
    <div class="brand">
      <span>✍️ 手写模拟工坊</span>
    </div>
    <div class="header-actions" id="headerActions">
      <!-- 预留按钮区域 -->
    </div>
  </header>

  <!-- 中间核心工作区 -->
  <main>
    <!-- 左侧参数设置区 -->
    <section class="control-panel" id="controlPanel">
      <h3 style="font-size: 15px; margin-bottom: 16px; color: #374151;">参数控制</h3>
      <!-- 下一步我们再往这里填原图里的表单组件 -->
    </section>

    <!-- 右侧画板预览区 -->
    <section class="preview-panel">
      <div class="preview-header">预览效果（支持实时渲染）</div>
      <div class="canvas-wrapper">
        <span style="color: #9ca3af; font-size: 14px;">[ Canvas 真实纸张预览区 ]</span>
      </div>
    </section>
  </main>

  <!-- 底部边框 -->
  <footer>
    <span>手写字迹生成系统 · 纯本地前端渲染</span>
  </footer>

</body>
</html>
